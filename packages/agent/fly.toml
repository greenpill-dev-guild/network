# fly.toml app configuration file generated for network-agent on 2026-05-18T06:32:39Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'network-agent'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  DIRECTUS_PUBLIC_URL = 'https://admin.greenpill.network'
  MAP_NODE_MODERATION_DIRECTUS_URL = 'https://admin.greenpill.network'
  MAP_NODE_MODERATION_BASE_URL = 'https://greenpill.network/map/moderate'
  # Enabled 2026-08-10 (decision in .plans/active/directus-cms-advancement):
  # per-recipient login-free moderation links with the staged 32-byte secret.
  # Rollback: set to 'false' and deploy - alerts return to Directus deep links.
  MAP_NODE_MODERATION_MAGIC_LINK_ENABLED = 'true'
  # Dispatch-on-publish: requires the CONTENT_DISPATCH_GITHUB_TOKEN Fly secret
  # (fine-grained PAT with contents:write on the repo); disabled without it.
  CONTENT_DISPATCH_ENABLED = 'true'
  CONTENT_DISPATCH_GITHUB_REPO = 'greenpill-dev-guild/network'
  # Content review notifications also need the CONTENT_REVIEW_RECIPIENTS Fly
  # secret (comma-separated emails); deliveries are skipped without it.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  path = "/ready"
  timeout = "10s"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
