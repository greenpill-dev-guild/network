name: PR Checks

# Runs on every pull request, whatever it touches, so a ruleset on main can
# require one check that says the change type-checks, keeps the repo's contract
# tests green and builds the site inside the Pages size budget. github-pages.yml
# builds only after a merge, which is too late to keep main whole.
#
# Nothing here needs a secret, a database or the network beyond the lockfile
# install. The build reads the committed fallback snapshot (no
# OPERATIONAL_CONTENT_SNAPSHOT_URL), which holds no remote chapter images, and
# the tests that need Postgres or a browser (`*:db`, `*:browser`) stay out.
# Steps that compile TypeScript run through `bun --bun`, so the compiler's node
# shebang runs on Bun, as in the Pages build, whatever Node the runner ships.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck packages and scripts
        run: bun --bun run typecheck

      - name: Check website types
        run: bun --bun run --cwd packages/website check

      - name: Content contract tests
        run: bun --bun run test:content

      - name: Agent contract tests
        run: bun --bun run test:agent

      - name: Map node contract tests
        run: bun --bun run test:map-nodes

      - name: Chapter impact contract tests
        run: bun --bun run test:chapter-impact

      - name: Validate plan hubs
        run: bun --bun run plans:validate

      - name: Build website
        run: bun run build:website

      # The same budget the Pages deploy enforces. This build uses the
      # committed snapshot, so live chapter image copies can still add a little
      # on deploy.
      - name: Check Pages size budget
        run: |
          bun test scripts/pages-artifact-size.test.ts
          bun --no-env-file scripts/pages-artifact-size.ts
