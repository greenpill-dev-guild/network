name: PR Checks

# Runs on every pull request, whatever it touches, so a ruleset on main can
# require one check that says the change type-checks, keeps every test file in
# scripts/ and the website CSS guard green, and builds the site inside the
# Pages size budget. github-pages.yml
# builds only after a merge, which is too late to keep main whole.
#
# Nothing here needs a secret, a database or the network beyond the lockfile
# install. The build reads the committed fallback snapshot (no
# OPERATIONAL_CONTENT_SNAPSHOT_URL), which holds no remote chapter images, and
# the proofs that need Postgres or a browser (`*.integration.ts`, `*:browser`)
# run elsewhere: database-proofs.yml for Postgres.
# Steps that compile TypeScript run through `bun --bun`, so the compiler's node
# shebang runs on Bun, as in the Pages build, whatever Node the runner ships.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          # The regrowth check compares the change with its merge base.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck packages and scripts
        run: bun --bun run typecheck

      - name: Check website types
        run: bun --bun run --cwd packages/website check

      - name: Validate plan hubs
        run: bun --bun run plans:validate

      - name: Browser verification policy
        run: bun run check:browser-verification-policy

      # oxlint, the kit's wrap-once rules and Biome formatting, behind the
      # shrink-only .agents/lint-baseline.json: a new finding fails.
      - name: Lint (shrink-only baseline)
        run: bun run lint

      # Judges only what this pull request adds: no comment the codemod's
      # narrow pass would remove, and no report-style markdown outside .plans/
      # and docs/.
      - name: No regrowth of purged comments or report markdown
        env:
          REGROWTH_BASE_REF: origin/${{ github.base_ref }}
        run: bun scripts/quality/check-regrowth.mjs

      - name: Build website
        run: bun run build:website

      # Every test file under scripts/ and the source CSS guard, in one
      # command. It runs after the build because the map route tests read
      # the built pages. `bun test ./scripts` picks up a new test file
      # without a workflow change.
      - name: All tests and the website CSS guard
        run: bun --bun run test

      # The same budget the Pages deploy enforces. This build uses the
      # committed snapshot, so live chapter image copies can still add a little
      # on deploy.
      - name: Check Pages size budget
        run: bun --no-env-file scripts/pages-artifact-size.ts
